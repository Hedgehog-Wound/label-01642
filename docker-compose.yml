version: '3.8'

services:
  frontend-portal:
    build:
      context: ./frontend-portal
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: portal-frontend
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  portal-network:
    driver: bridge
